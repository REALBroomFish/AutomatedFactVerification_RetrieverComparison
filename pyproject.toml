[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "factverify"
version = "0.1.0"
description = "Evidence retrieval experiments for automated fact verification"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "numpy",
    "pandas",
    "nltk",
    "rank-bm25",
    "torch",
    "transformers",
    "sentence-transformers",
]

[project.optional-dependencies]
notebooks = [
    "matplotlib",
    "psutil",
    "nvidia-ml-py",
    "huggingface-hub",
    "hf-xet",
    "python-dotenv",
    "jupyter",
    "ipykernel",
    "ipywidgets",
    "tqdm",
]

[tool.setuptools.packages.find]
where = ["src"]